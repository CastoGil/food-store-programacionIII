<!doctype html>

<html lang="es">

  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>Registro - Food Store</title>
  </head>


  <body>

    <main>

      <h1>🍕 Food Store</h1>

      <h2>Crear cuenta</h2>

      <form id="registro-form">

        <div>
          <label for="email">Email:</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="tucorreo@ejemplo.com"
            required
          >
        </div>


        <div>
          <label for="password">Contraseña:</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresá tu contraseña"
            required
          >
        </div>


        <button type="submit">
          Registrarse
        </button>

      </form>


      <p>
        ¿Ya tenés cuenta?

        <a href="../login/login.html">
          Iniciar sesión
        </a>
      </p>

    </main>


    <script
      type="module"
      src="./registro.ts"
    ></script>

  </body>

</html>
