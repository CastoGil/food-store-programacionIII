<!doctype html>

<html lang="es">

  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Food Store</title>
  </head>


  <body>

    <main>

      <h1>🍕 Food Store</h1>

      <h2>Iniciar Sesión</h2>


      <form id="login-form">

        <div>

          <label for="email">
            Email:
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="tucorreo@ejemplo.com"
            required
          >

        </div>


        <div>

          <label for="password">
            Contraseña:
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Ingresá tu contraseña"
            required
          >

        </div>


        <button type="submit">
          Ingresar
        </button>

      </form>


      <p>
        ¿No tenés cuenta?

        <a href="../registro/registro.html">
          Registrate
        </a>
      </p>

    </main>


    <script
      type="module"
      src="./login.ts"
    ></script>

  </body>

</html>
